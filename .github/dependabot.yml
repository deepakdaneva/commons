# Weekly dependency updates, raised against development (the integration branch).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    ignore:
      # JUnit 6 requires Java 17; this library supports Java 11
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
      # Spotless 3 requires Java 17 to run; CI builds on Java 11
      - dependency-name: "com.diffplug.spotless:spotless-maven-plugin"
        update-types: ["version-update:semver-major"]
    groups:
      maven-plugins:
        patterns: ["org.apache.maven.plugins:*", "*-maven-plugin"]
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
